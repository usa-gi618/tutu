<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="tutu" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <link rel="icon" type="image/png" href="assets/app-icon-192.png" />
  <title>tutu</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="screens/onboarding/onboarding.css" />
  <link rel="stylesheet" href="screens/home/home.css" />
  <link rel="stylesheet" href="screens/quickcheck/quickcheck.css" />
  <link rel="stylesheet" href="screens/result/result.css" />
  <link rel="stylesheet" href="screens/library/library.css" />
  <link rel="stylesheet" href="screens/lecture/lecture.css" />
  <link rel="stylesheet" href="screens/player/player.css" />
  <link rel="stylesheet" href="screens/review/review.css" />
  <link rel="stylesheet" href="screens/teacher/teacher.css" />
</head>
<body>
  <main class="stage" id="stage"></main>
  <script src="vendor/lottie_svg.min.js"></script>
  <script type="module" src="js/app.js"></script>
  <script>
    // iOS Safari는 폰을 돌렸다 돌아오면 확대된 채로 남을 때가 있다 → 돌릴 때마다 배율을 1로 되돌린다
    (() => {
      const vp = document.querySelector('meta[name="viewport"]');
      const base = vp.content;
      const reset = () => {
        vp.content = base + ', minimum-scale=1';
        requestAnimationFrame(() => { vp.content = base; });
      };
      window.addEventListener('orientationchange', reset);
      window.visualViewport?.addEventListener('resize', () => { if (visualViewport.scale > 1.01) reset(); });
    })();
  </script>
  <script>
    // 개발용 라이브 리로드 (serve.py로 띄웠을 때만 동작)
    // 보고 있는 탭만 연결한다 (뒤에 쌓인 탭들이 연결을 붙잡으면 브라우저 연결 수가 차서 새 페이지가 안 뜬다)
    if (location.port === '8000') {
      let live = null;
      const connect = () => {
        live?.close();
        live = document.hidden ? null : new EventSource('/__livereload');
        if (live) live.onmessage = () => location.reload();
      };
      document.addEventListener('visibilitychange', connect);
      connect();
    }
  </script>
</body>
</html>
